<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background decorative rings -->
  <circle cx="250" cy="200" r="170" fill="url(#glowGrad)" />
  <circle cx="250" cy="200" r="130" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="250" cy="200" r="90" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>

  <!-- Scanning grid / target -->
  <rect x="150" y="100" width="200" height="200" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.08))"/>
  
  <!-- Lesion Graphic Mockup -->
  <path d="M 230,170 C 260,150 290,180 270,210 C 255,230 220,240 210,210 C 200,185 210,180 230,170 Z" fill="#9a3412" opacity="0.85"/>
  <circle cx="245" cy="195" r="14" fill="#7c2d12"/>

  <!-- Neural Network Node overlay -->
  <g stroke="#0284c7" stroke-width="1.5">
    <line x1="180" y1="130" x2="220" y2="160"/>
    <line x1="320" y1="130" x2="280" y2="160"/>
    <line x1="180" y1="270" x2="220" y2="240"/>
    <line x1="320" y1="270" x2="280" y2="240"/>
  </g>
  <circle cx="180" cy="130" r="6" fill="#0284c7"/>
  <circle cx="320" cy="130" r="6" fill="#0d9488"/>
  <circle cx="180" cy="270" r="6" fill="#0d9488"/>
  <circle cx="320" cy="270" r="6" fill="#0284c7"/>

  <!-- Crosshair corners -->
  <path d="M 180,160 L 165,160 L 165,175" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
  <path d="M 320,160 L 335,160 L 335,175" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
  <path d="M 180,240 L 165,240 L 165,225" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
  <path d="M 320,240 L 335,240 L 335,225" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>

  <!-- Floating confidence pill -->
  <g filter="drop-shadow(0 6px 12px rgba(2,132,199,0.25))">
    <rect x="290" y="220" width="130" height="38" rx="19" fill="#0284c7"/>
    <text x="355" y="244" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">AI Match: 96.4%</text>
  </g>
</svg>
